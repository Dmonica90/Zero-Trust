name: Deploy to GitHub Pages

# Publishes the game at https://dmonica90.github.io/Zero-Trust/ on every push to
# main. The site is built here rather than committed, so the repository keeps
# only sources.
#
# One-time setup: Settings -> Pages -> Source must be set to "GitHub Actions".

on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab without pushing anything.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one waits rather than being cancelled,
# so the last push to main always wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # A broken build should never reach the live site. `npm run build` also
      # typechecks, and the unit tests cover the game rules and both story files.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
