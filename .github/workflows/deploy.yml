name: Deploy to GitHub Pages

# Publishes the Articulate Storyline course at
# https://dmonica90.github.io/Zero-Trust/ on every push to main. The repository
# root already is the published course, so there is nothing to build: the files
# are uploaded as they are.
#
# One-time setup: Settings -> Pages -> Source must be set to "GitHub Actions".

on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab without pushing anything.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one waits rather than being cancelled,
# so the last push to main always wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # .git and .github are left out of the artifact by default.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
